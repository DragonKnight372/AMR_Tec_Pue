; ================================================================
;  AMR1 — PlatformIO multi-environment
;  Seleccionar el entorno desde la barra de PlatformIO en VS Code
; ================================================================

[common]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board = adafruit_feather_can
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit MCP2515
    adafruit/Adafruit BusIO

; ----------------------------------------------------------------
;  TREN MOTRIZ
;  _can / _serial = estable  ·  _test = sandbox (si falla, volver a _can)
; ----------------------------------------------------------------
[env:tren_motriz_can]
extends = common
build_src_filter = +<tren_motriz/can/>

[env:tren_motriz_serial]
extends = common
build_src_filter = +<tren_motriz/serial/>

[env:tren_motriz_test]
extends = common
build_src_filter = +<tren_motriz/test/>

; ----------------------------------------------------------------
;  FRENO
;  _can / _serial = estable  ·  _test = sandbox (si falla, volver a _can)
; ----------------------------------------------------------------
[env:freno_can]
extends = common
build_src_filter = +<freno/can/>

[env:freno_serial]
extends = common
build_src_filter = +<freno/serial/>

[env:freno_test]
extends = common
build_src_filter = +<freno/test/>

; ----------------------------------------------------------------
;  DIRECCIÓN
;  _can / _serial = estable  ·  _test = sandbox (si falla, volver a _can)
; ----------------------------------------------------------------
[env:direccion_can]
extends = common
build_src_filter = +<direccion/can/>

[env:direccion_serial]
extends = common
build_src_filter = +<direccion/serial/>

[env:direccion_test]
extends = common
build_src_filter = +<direccion/test/>

; ----------------------------------------------------------------
;  INTÉRPRETE
;  _can / _serial = estable  ·  _test = sandbox (si falla, volver a _can)
; ----------------------------------------------------------------
[env:interprete_can]
extends = common
build_src_filter = +<interprete/can/>

[env:interprete_serial]
extends = common
build_src_filter = +<interprete/serial/>

[env:interprete_test]
extends = common
build_src_filter = +<interprete/test/>

; ----------------------------------------------------------------
;  SENSORES
;  _can / _serial = estable  ·  _test = sandbox (si falla, volver a _can)
;  env:sensores = alias de sensores_can (compatibilidad)
; ----------------------------------------------------------------
[sensores_common]
extends = common
lib_deps =
    ${common.lib_deps}
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BNO055

[env:sensores_can]
extends = sensores_common
build_src_filter = +<sensores/can/>

[env:sensores_serial]
extends = sensores_common
build_src_filter = +<sensores/serial/>

[env:sensores_test]
extends = sensores_common
build_src_filter = +<sensores/test/>

[env:sensores]
extends = sensores_common
build_src_filter = +<sensores/can/>